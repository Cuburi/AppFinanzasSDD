services:
  postgres:
    image: postgres:16-alpine
    container_name: appfinanzas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: appfinanzas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - appfinanzas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appfinanzas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  appfinanzas_postgres_data:
