name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-governance:
    name: PR governance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check PR governance metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-governance.mjs

  branch-release-readiness:
    name: Branch release readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check environment profile contracts
        run: pnpm local:check-env

      - name: Check branch release documentation
        run: pnpm local:check-readme

  server:
    name: Server checks
    runs-on: ubuntu-latest
    services:
      postgres-dev:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appfinanzas_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d appfinanzas_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare dev environment profile
        run: pnpm env:dev

      - name: Verify PostgreSQL readiness
        run: |
          for attempt in {1..30}; do
            if pg_isready --host localhost --port 5433 --username postgres --dbname appfinanzas_dev; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Generate Prisma client
        run: pnpm prisma:dev:generate

      - name: Apply Prisma migrations
        run: pnpm prisma:dev:migrate

      - name: Typecheck
        run: pnpm --dir server exec tsc -p tsconfig.json --noEmit

      - name: Build server
        run: pnpm --dir server build

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/appfinanzas_dev?schema=public
        run: pnpm --dir server test

  client:
    name: Client checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir client typecheck

      - name: Run tests
        run: pnpm --dir client test

      - name: Build production frontend
        run: pnpm --dir client build
